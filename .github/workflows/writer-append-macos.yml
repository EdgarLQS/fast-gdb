name: writer-append-macos

on:
  pull_request:
    paths:
      - '.github/workflows/writer-append-macos.yml'
      - 'cmake/**'
      - 'src/edgar/explorgdb/writer/**'
      - 'tests/contracts/writer-append-macos-v1.json'
      - 'tests/edgar/explorgdb/writer/test_writer_append*.cpp'
      - 'tests/package_consumer/**'
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writer-append-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  append-contract:
    name: writer-non-empty-append-macos
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: brew install ninja gdal

      - name: Verify OpenFileGDB update support
        shell: bash
        run: |
          set -euo pipefail
          gdalinfo --version | tee append-gdal-version.log
          ogrinfo --formats | tee append-gdal-formats.log
          grep -q 'OpenFileGDB' append-gdal-formats.log
          grep -q 'rw' append-gdal-formats.log

      - name: Configure Release append contract
        run: >-
          cmake -S . -B build-append -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=ON
          -DBUILD_TESTING=ON

      - name: Build append tests
        run: cmake --build build-append --target gdb_tutorial_test_runner --parallel

      - name: Run schema-v2 append contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_test_contract.py \
            --manifest tests/contracts/writer-append-macos-v1.json \
            --full-test-binary build-append/bin/gdb_tutorial_test_runner \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/writer-append-results" \
            --build-type Release \
            --repeat 3

      - name: Install and consume append API
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build-append \
            --prefix "$GITHUB_WORKSPACE/install-append"
          test -f "$GITHUB_WORKSPACE/install-append/include/fast_gdb/writer/writer_append.h"
          cmake -S tests/package_consumer -B build-append-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install-append" \
            -DFAST_GDB_CONSUMER_TARGET=writer \
            -DFAST_GDB_CONSUMER_CHECK_APPEND=ON
          cmake --build build-append-consumer --parallel
          ./build-append-consumer/fast_gdb_package_consumer

      - name: Upload append evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-append-macos-${{ github.sha }}
          path: |
            writer-append-results/
            append-gdal-version.log
            append-gdal-formats.log
          if-no-files-found: error
          retention-days: 30
