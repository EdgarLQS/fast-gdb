name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linear-packages:
    name: linear-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=OFF
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=ON
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DFAST_GDB_PACKAGE_VARIANT=linear
          -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build-release --parallel
      - name: Package
        shell: bash
        run: |
          cd build-release
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cpack -G ZIP
          else
            cpack -G TGZ
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linear-${{ matrix.os }}
          path: build-release/fast-gdb-0.1.0-*
          if-no-files-found: error

  hybrid-linux-package:
    name: hybrid-ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgdal-dev
      - name: Configure
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=ON
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DFAST_GDB_PACKAGE_VARIANT=hybrid
          -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build-release --parallel
      - name: Package
        run: cd build-release && cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-ubuntu-latest
          path: build-release/fast-gdb-0.1.0-*
          if-no-files-found: error

  publish:
    name: publish-github-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linear-packages, hybrid-linux-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum fast-gdb-* > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --title "fast-gdb ${GITHUB_REF_NAME}"
          --notes-file docs/releases/v0.1.0.md
          --verify-tag
