name: release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
      - scripts/stage_release.py
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linear-packages:
    name: linear-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=OFF
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=OFF
      - name: Build publishable targets
        run: >-
          cmake --build build-release
          --target fast_gdb_geometry_core explorgdb_common_lib explorgdb_reader_lib explorgdb_writer_lib
          --parallel
      - name: Stage package
        env:
          PACKAGE: fast-gdb-0.1.0-${{ runner.os }}-${{ runner.arch }}-linear
        run: >-
          python scripts/stage_release.py
          --repo .
          --build build-release
          --output dist/${{ env.PACKAGE }}
          --variant linear
      - name: Archive package (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE: fast-gdb-0.1.0-${{ runner.os }}-${{ runner.arch }}-linear
        run: tar -czf "dist/${PACKAGE}.tar.gz" -C dist "${PACKAGE}"
      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE: fast-gdb-0.1.0-${{ runner.os }}-${{ runner.arch }}-linear
        run: Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: linear-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  hybrid-linux-package:
    name: hybrid-ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgdal-dev
      - name: Configure
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=OFF
      - name: Build publishable targets
        run: >-
          cmake --build build-release
          --target fast_gdb_geometry_core explorgdb_common_lib explorgdb_reader_lib explorgdb_writer_lib fast_gdb_curve_gdal
          --parallel
      - name: Stage package
        env:
          PACKAGE: fast-gdb-0.1.0-Linux-${{ runner.arch }}-hybrid
        run: >-
          python3 scripts/stage_release.py
          --repo .
          --build build-release
          --output dist/${{ env.PACKAGE }}
          --variant hybrid
      - name: Archive package
        shell: bash
        env:
          PACKAGE: fast-gdb-0.1.0-Linux-${{ runner.arch }}-hybrid
        run: tar -czf "dist/${PACKAGE}.tar.gz" -C dist "${PACKAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-ubuntu-latest
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: [linear-packages, hybrid-linux-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum fast-gdb-* > SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "fast-gdb ${TAG}" \
              --notes-file docs/releases/v0.1.0.md
          fi
