name: main-release-gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-cpp:
    name: pure-cpp-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >-
          cmake -S . -B build-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=OFF
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-core --target fast_gdb_geometry_test_runner --parallel
      - name: Test
        run: ctest --test-dir build-core --output-on-failure -R '^geometry\.'

  hybrid-linux:
    name: hybrid-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgdal-dev
      - name: Configure
        run: >-
          cmake -S . -B build-hybrid -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-hybrid --target fast_gdb_geometry_test_runner fast_gdb_hybrid_test_runner fast_gdb_curve_gdal --parallel
      - name: Test
        run: ctest --test-dir build-hybrid --output-on-failure -R '^(geometry|hybrid)\.'

  sanitizer:
    name: asan-ubsan-lsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFAST_GDB_WITH_GDAL=OFF
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-sanitize --target fast_gdb_geometry_test_runner --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure -R '^geometry\.'
