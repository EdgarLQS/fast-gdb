name: spatial-where-branch

on:
  push:
    branches:
      - codex/spatial-attribute-query
  workflow_dispatch:

concurrency:
  group: spatial-where-${{ github.ref }}-${{ matrix.gdal }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tests:
    name: release-gdal-${{ matrix.gdal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gdal: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgdal-dev
      - name: Configure Release
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=${{ matrix.gdal }}
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=ON
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run complete CTest
        run: ctest --test-dir build --output-on-failure
