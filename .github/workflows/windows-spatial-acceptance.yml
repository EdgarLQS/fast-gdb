name: windows-spatial-acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/edgar/explorgdb/reader/**'
      - 'tests/edgar/explorgdb/integration/gdal_parity/benchmark/test_spatial_benchmark.cpp'
      - 'tests/edgar/explorgdb/reader/io/test_windows_mmap_io.cpp'
      - 'tests/edgar/explorgdb/integration/gdal_parity/spatial_where/test_spatial_query_adaptive.cpp'
      - 'tests/createdata/cpp/generate_large_gdb.cpp'
      - 'tools/ci/windows/run_spatial_acceptance.ps1'
      - 'tools/ci/windows/run_spatial_main_ab.ps1'
      - '.github/workflows/windows-spatial-acceptance.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'

permissions:
  contents: read

concurrency:
  group: windows-spatial-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release-matrix:
    name: windows-release-1m-10m-main-ab
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gdal

      - name: Install identical benchmark harness in baseline
        shell: msys2 {0}
        run: >-
          cp tests/edgar/explorgdb/integration/gdal_parity/benchmark/test_spatial_benchmark.cpp
          baseline/tests/edgar/explorgdb/integration/gdal_parity/benchmark/test_spatial_benchmark.cpp

      - name: Configure current Windows Release build
        shell: msys2 {0}
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=ON
          -DFAST_GDB_BUILD_FULL_TESTS=ON
          -DBUILD_TESTING=ON

      - name: Configure main baseline Windows Release build
        shell: msys2 {0}
        run: >-
          cmake -S baseline -B baseline/build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=ON
          -DBUILD_TESTING=ON

      - name: Build current and main benchmark binaries
        shell: msys2 {0}
        run: |
          cmake --build build-windows --target gdb_tutorial_test_runner generate_large_gdb --parallel 2
          cmake --build baseline/build-windows --target gdb_tutorial_test_runner --parallel 2

      - name: Run Windows mmap and positional-I/O unit tests
        shell: msys2 {0}
        run: >-
          ctest --test-dir build-windows --output-on-failure
          -R 'full\.(WindowsMmapIoTest|SpatialQueryAdaptiveTest)\.'

      - name: Restore reusable 1M and 10M point fixtures
        uses: actions/cache@v4
        with:
          path: test_data/spatial_matrix/windows
          key: windows-spatial-point-fixtures-v2

      - name: Download and initialize RAMMap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/rammap | Out-Null
          Invoke-WebRequest `
            -Uri 'https://download.sysinternals.com/files/RAMMap.zip' `
            -OutFile tools/rammap/RAMMap.zip
          Expand-Archive tools/rammap/RAMMap.zip tools/rammap -Force
          $ramMap = (Resolve-Path tools/rammap/RAMMap64.exe).Path
          @(
            '@echo off',
            ('"' + $ramMap + '" -accepteula -Ew >nul'),
            'if errorlevel 1 exit /b %errorlevel%',
            ('"' + $ramMap + '" -accepteula -Es >nul'),
            'exit /b %errorlevel%'
          ) | Set-Content tools/rammap/clear-file-cache.cmd -Encoding Ascii
          & cmd.exe /d /c tools/rammap/clear-file-cache.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "RAMMap cache-clear initialization returned exit code $LASTEXITCODE"
          }

      - name: Run Windows Release acceptance matrix
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          ./tools/ci/windows/run_spatial_acceptance.ps1 `
            -BuildDir build-windows `
            -DataRoot test_data/spatial_matrix/windows `
            -OutputDir artifacts/windows-spatial-acceptance `
            -RamMapPath tools/rammap/clear-file-cache.cmd `
            -Generate

      - name: Run isolated Windows fallback current-versus-main A/B
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          ./tools/ci/windows/run_spatial_main_ab.ps1 `
            -CurrentBuildDir build-windows `
            -BaselineBuildDir baseline/build-windows `
            -DataRoot test_data/spatial_matrix/windows `
            -OutputDir artifacts/windows-spatial-main-ab `
            -CacheClearCommand tools/rammap/clear-file-cache.cmd

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-spatial-acceptance-${{ github.run_id }}
          path: |
            artifacts/windows-spatial-acceptance
            artifacts/windows-spatial-main-ab
          if-no-files-found: warn
