name: writer-macos-contract

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writer-macos-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: writer-release-contract-macos
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS dependencies
        run: brew install ninja gdal

      - name: Verify GDAL OpenFileGDB support
        shell: bash
        run: |
          set -euo pipefail
          gdalinfo --version
          ogrinfo --formats | tee gdal-formats.log
          grep -q 'OpenFileGDB' gdal-formats.log

      - name: Configure Release contract tests
        run: >-
          cmake -S . -B build-contract -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_CURVE_BACKEND=BUILTIN
          -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=ON
          -DBUILD_TESTING=ON

      - name: Build Writer, Index and Reader contract tests
        run: cmake --build build-contract --target gdb_tutorial_test_runner --parallel

      - name: Configure and install Writer package without GDAL
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-package-nogdal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAST_GDB_WITH_GDAL=OFF \
            -DFAST_GDB_CURVE_BACKEND=BUILTIN \
            -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB \
            -DFAST_GDB_BUILD_TOOLS=OFF \
            -DFAST_GDB_BUILD_FULL_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build-package-nogdal --target explorgdb_writer_lib --parallel
          cmake --install build-package-nogdal \
            --prefix "$GITHUB_WORKSPACE/install-package-nogdal"
          cmake -S tests/package_consumer -B build-consumer-nogdal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install-package-nogdal" \
            -DFAST_GDB_CONSUMER_TARGET=writer
          cmake --build build-consumer-nogdal --parallel

      - name: Configure and install Writer package with GDAL
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-package-gdal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAST_GDB_WITH_GDAL=ON \
            -DFAST_GDB_CURVE_BACKEND=BUILTIN \
            -DFAST_GDB_GEOMETRY_OUTPUT=STANDARD_WKB \
            -DFAST_GDB_BUILD_TOOLS=OFF \
            -DFAST_GDB_BUILD_FULL_TESTS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build-package-gdal --target explorgdb_writer_lib --parallel
          cmake --install build-package-gdal \
            --prefix "$GITHUB_WORKSPACE/install-package-gdal"
          cmake -S tests/package_consumer -B build-consumer-gdal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install-package-gdal" \
            -DFAST_GDB_CONSUMER_TARGET=writer
          cmake --build build-consumer-gdal --parallel

      - name: Run schema-v2 Writer contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_test_contract.py \
            --manifest tests/contracts/writer-macos-v2.json \
            --full-test-binary build-contract/bin/gdb_tutorial_test_runner \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/writer-contract-results" \
            --build-type Release \
            --repeat 3

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-macos-contract-${{ github.sha }}
          path: |
            writer-contract-results/
            gdal-formats.log
          if-no-files-found: error
          retention-days: 30
