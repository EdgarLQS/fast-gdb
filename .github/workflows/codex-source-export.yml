name: codex-source-export

on:
  push:
    branches:
      - codex/spatial-attribute-query
    paths:
      - .github/workflows/codex-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source tree
        run: tar --exclude=.git -czf fast-gdb-source.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: fast-gdb-source
          path: fast-gdb-source.tar.gz
          if-no-files-found: error
          retention-days: 1
