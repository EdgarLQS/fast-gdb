name: source-snapshot

on:
  push:
    branches:
      - agent/fix-pure-cpp-m-curves-release-gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned GoogleTest source
        run: git clone --depth 1 --branch v1.15.2 https://github.com/google/googletest.git third_party/googletest
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fast-gdb-source-with-gtest-${{ github.sha }}
          path: |
            CMakeLists.txt
            src
            tests
            docs
            third_party/googletest
          if-no-files-found: error
          retention-days: 1
