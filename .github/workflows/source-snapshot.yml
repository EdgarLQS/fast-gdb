name: source-snapshot

on:
  push:
    branches:
      - agent/fix-pure-cpp-m-curves-release-gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fast-gdb-source-${{ github.sha }}
          path: |
            CMakeLists.txt
            src
            tests
            docs
          if-no-files-found: error
          retention-days: 1
