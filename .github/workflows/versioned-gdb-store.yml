name: versioned-gdb-store

on:
  pull_request:
    paths:
      - 'include/fast_gdb/writer/**'
      - 'src/edgar/explorgdb/writer/versioned_gdb_*.cpp'
      - 'src/edgar/explorgdb/writer/versioned_gdb_store_internal.h'
      - 'tests/edgar/explorgdb/writer/test_versioned_gdb_store*.cpp'
      - 'tests/package_consumer/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/versioned-gdb-store.yml'
  push:
    branches: [main]
    paths:
      - 'include/fast_gdb/writer/**'
      - 'src/edgar/explorgdb/writer/versioned_gdb_*.cpp'
      - 'src/edgar/explorgdb/writer/versioned_gdb_store_internal.h'
      - 'tests/edgar/explorgdb/writer/test_versioned_gdb_store*.cpp'
      - 'tests/package_consumer/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/versioned-gdb-store.yml'

jobs:
  managed-store:
    name: managed-store-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DFAST_GDB_WITH_GDAL=OFF
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build managed store tests
        run: cmake --build build --config Release --target fast_gdb_versioned_store_test_runner --parallel

      - name: Run managed store tests
        run: ctest --test-dir build -C Release --output-on-failure -R '^versioned-store\.'

      - name: Install package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"

      - name: Verify public Writer surface
        shell: bash
        run: |
          writer_include="${{ github.workspace }}/install/include/fast_gdb/writer"
          test -f "$writer_include/versioned_gdb_store.h"
          test -f "$writer_include/versioned_gdb_validator.h"

          for removed in \
            writer_session.h writer_recovery.h writer_index.h \
            writer_append.h writer_update.h writer_delete.h \
            writer_transaction.h gdb_table_writer.h; do
            test ! -e "$writer_include/$removed"
          done

          exported_cmake="${{ github.workspace }}/install/lib/cmake/fast_gdb"
          if grep -R "writer_legacy" "$exported_cmake"; then
            echo "writer_legacy must not be exported"
            exit 1
          fi

      - name: Configure installed Writer consumer
        run: >-
          cmake -S tests/package_consumer -B consumer-build
          -DFAST_GDB_CONSUMER_TARGET=writer
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build installed Writer consumer
        run: cmake --build consumer-build --config Release --parallel

      - name: Run installed Writer consumer
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./consumer-build/Release/fast_gdb_package_consumer.exe
          else
            ./consumer-build/fast_gdb_package_consumer
          fi

  gdal-write-visibility:
    name: gdal-write-read-visibility-ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL OpenFileGDB development package
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
          gdal-config --version
          ogrinfo --formats | grep -F 'OpenFileGDB'

      - name: Configure focused GDAL visibility test
        run: >-
          cmake -S . -B build-gdal-visibility
          -DFAST_GDB_WITH_GDAL=ON
          -DFAST_GDB_BUILD_TOOLS=OFF
          -DFAST_GDB_BUILD_FULL_TESTS=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build GDAL visibility test
        run: >-
          cmake --build build-gdal-visibility --config Release
          --target fast_gdb_gdal_visibility_test_runner --parallel

      - name: Run GDAL visibility contract
        run: >-
          ctest --test-dir build-gdal-visibility -C Release
          --output-on-failure -R '^versioned-gdal-visibility\.'
