name: writer-update-macos

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    paths:
      - '.github/workflows/writer-update-macos.yml'
      - 'cmake/**'
      - 'scripts/run_test_contract.py'
      - 'src/edgar/explorgdb/writer/**'
      - 'tests/contracts/writer-update-macos-v1.json'
      - 'tests/edgar/explorgdb/writer/test_writer_update.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writer-update-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-contract:
    name: writer-staged-update-macos
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: brew install ninja gdal
      - name: Verify OpenFileGDB
        run: |
          set -euo pipefail
          ogrinfo --formats | tee update-gdal-formats.log
          grep -q 'OpenFileGDB' update-gdal-formats.log
      - name: Configure and build Release tests
        run: |
          set -euo pipefail
          cmake -S . -B build-update -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFAST_GDB_WITH_GDAL=ON \
            -DFAST_GDB_BUILD_TOOLS=OFF \
            -DFAST_GDB_BUILD_FULL_TESTS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-update --target gdb_tutorial_test_runner --parallel
      - name: Install package and verify Update header
        run: |
          set -euo pipefail
          cmake --install build-update --prefix "$GITHUB_WORKSPACE/install-update"
          stable="$GITHUB_WORKSPACE/install-update/include/fast_gdb/writer"
          test -f "$stable/writer_update.h"
          test -f "$stable/writer_append.h"
          test -f "$stable/writer_session.h"
          test ! -e "$stable/gdb_table_writer.h"
      - name: Run schema-v2 Update contract three times
        run: |
          set -euo pipefail
          python3 scripts/run_test_contract.py \
            --manifest tests/contracts/writer-update-macos-v1.json \
            --full-test-binary build-update/bin/gdb_tutorial_test_runner \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/writer-update-results" \
            --build-type Release \
            --repeat 3
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-update-macos-${{ github.sha }}
          path: |
            writer-update-results/
            update-gdal-formats.log
          if-no-files-found: error
          retention-days: 30
