name: release-bootstrap

on:
  push:
    branches:
      - agent/release-v0-1-0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v0-1-0
      - name: Apply idempotent CMake and CI changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('CMakeLists.txt')
          s = p.read_text()
          s = s.replace('project(fast_gdb LANGUAGES CXX)',
                        'project(fast_gdb VERSION 0.1.0 LANGUAGES CXX)')
          s = s.replace('include(CTest)\n',
                        'include(CTest)\ninclude(GNUInstallDirs)\ninclude(CMakePackageConfigHelpers)\n')
          marker = 'option(FAST_GDB_BUILD_FULL_TESTS\n       "Build the complete FileGDB reader/writer test suite" ON)\n'
          replacement = marker + 'set(FAST_GDB_PACKAGE_VARIANT "linear" CACHE STRING\n    "Package variant name used by CPack, for example linear or hybrid")\n'
          if 'FAST_GDB_PACKAGE_VARIANT' not in s:
              s = s.replace(marker, replacement)

          replacements = {
              '''target_include_directories(fast_gdb_geometry_core PUBLIC
              ${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/reader)''': '''target_include_directories(fast_gdb_geometry_core PUBLIC
              $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/reader>
              $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/reader>)''',
              '''target_include_directories(explorgdb_common_lib PUBLIC
              ${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/common)''': '''target_include_directories(explorgdb_common_lib PUBLIC
              $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/common>
              $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/common>)''',
              '''target_include_directories(explorgdb_reader_lib PUBLIC
              ${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/reader)''': '''target_include_directories(explorgdb_reader_lib PUBLIC
              $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/reader>
              $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/reader>)''',
              '''target_include_directories(explorgdb_writer_lib PUBLIC
              ${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/writer)''': '''target_include_directories(explorgdb_writer_lib PUBLIC
              $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/writer>
              $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/writer>)''',
              '''    target_include_directories(fast_gdb_curve_gdal PUBLIC
                  ${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/curve_gdal
                  ${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/reader)''': '''    target_include_directories(fast_gdb_curve_gdal PUBLIC
                  $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/curve_gdal>
                  $<BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/src/edgar/explorgdb/reader>
                  $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/curve_gdal>
                  $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/reader>)'''
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          package_block = r'''

          # ===== Install and package =====
          set(FAST_GDB_INSTALL_TARGETS
              fast_gdb_geometry_core
              explorgdb_common_lib
              explorgdb_reader_lib
              explorgdb_writer_lib
              fast_gdb_linear)
          if(FAST_GDB_WITH_GDAL)
              list(APPEND FAST_GDB_INSTALL_TARGETS fast_gdb_curve_gdal fast_gdb_hybrid)
              if(TARGET fast_gdb_gdal_dependency)
                  list(APPEND FAST_GDB_INSTALL_TARGETS fast_gdb_gdal_dependency)
              endif()
          endif()

          install(TARGETS ${FAST_GDB_INSTALL_TARGETS}
              EXPORT fast_gdbTargets
              ARCHIVE DESTINATION ${CMAKE_INSTALL_LIBDIR}
              LIBRARY DESTINATION ${CMAKE_INSTALL_LIBDIR}
              RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR}
              INCLUDES DESTINATION ${CMAKE_INSTALL_INCLUDEDIR})

          if(TARGET explorgdb_cli)
              install(TARGETS explorgdb_cli RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR})
          endif()

          install(DIRECTORY src/edgar/explorgdb/common/
              DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/common
              FILES_MATCHING PATTERN "*.h" PATTERN "*.hpp")
          install(DIRECTORY src/edgar/explorgdb/reader/
              DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/reader
              FILES_MATCHING PATTERN "*.h" PATTERN "*.hpp")
          install(DIRECTORY src/edgar/explorgdb/writer/
              DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/writer
              FILES_MATCHING PATTERN "*.h" PATTERN "*.hpp")
          if(FAST_GDB_WITH_GDAL)
              install(DIRECTORY src/edgar/explorgdb/curve_gdal/
                  DESTINATION ${CMAKE_INSTALL_INCLUDEDIR}/fast_gdb/curve_gdal
                  FILES_MATCHING PATTERN "*.h" PATTERN "*.hpp")
          endif()

          configure_package_config_file(
              ${CMAKE_CURRENT_SOURCE_DIR}/cmake/fast_gdbConfig.cmake.in
              ${CMAKE_CURRENT_BINARY_DIR}/fast_gdbConfig.cmake
              INSTALL_DESTINATION ${CMAKE_INSTALL_LIBDIR}/cmake/fast_gdb)
          write_basic_package_version_file(
              ${CMAKE_CURRENT_BINARY_DIR}/fast_gdbConfigVersion.cmake
              VERSION ${PROJECT_VERSION}
              COMPATIBILITY SameMajorVersion)

          install(EXPORT fast_gdbTargets
              FILE fast_gdbTargets.cmake
              NAMESPACE fast_gdb::
              DESTINATION ${CMAKE_INSTALL_LIBDIR}/cmake/fast_gdb)
          install(FILES
              ${CMAKE_CURRENT_BINARY_DIR}/fast_gdbConfig.cmake
              ${CMAKE_CURRENT_BINARY_DIR}/fast_gdbConfigVersion.cmake
              DESTINATION ${CMAKE_INSTALL_LIBDIR}/cmake/fast_gdb)
          install(FILES CLAUDE.md CHANGELOG.md
              DESTINATION ${CMAKE_INSTALL_DOCDIR})

          set(CPACK_PACKAGE_NAME "fast-gdb")
          set(CPACK_PACKAGE_VENDOR "EdgarLQS")
          set(CPACK_PACKAGE_VERSION ${PROJECT_VERSION})
          set(CPACK_PACKAGE_DESCRIPTION_SUMMARY
              "C++17 FileGDB reader and geometry engine with optional GDAL hybrid fallback")
          set(CPACK_PACKAGE_FILE_NAME
              "fast-gdb-${PROJECT_VERSION}-${CMAKE_SYSTEM_NAME}-${CMAKE_SYSTEM_PROCESSOR}-${FAST_GDB_PACKAGE_VARIANT}")
          set(CPACK_INCLUDE_TOPLEVEL_DIRECTORY ON)
          include(CPack)
          '''
          package_block = '\n'.join(line[10:] if line.startswith('          ') else line
                                    for line in package_block.splitlines())
          if '# ===== Install and package =====' not in s:
              s += package_block
          p.write_text(s)

          workflow = Path('.github/workflows/geometry-correctness.yml')
          w = workflow.read_text()
          if "      - main\n      - 'agent/**'" not in w:
              w = w.replace("    branches:\n      - 'agent/**'",
                            "    branches:\n      - main\n      - 'agent/**'")
          workflow.write_text(w)
          PY
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt .github/workflows/geometry-correctness.yml
          git commit -m 'build: add v0.1.0 install and package rules'
          git push origin HEAD:agent/release-v0-1-0
